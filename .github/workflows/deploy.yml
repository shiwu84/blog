name: Deploy blog

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-blog
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SITE_URL: https://blog.shiwu.dev
      BASE_PATH: /
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: dist
          retention-days: 7

  deploy:
    name: Deploy to server
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: dist

      - name: Validate deploy secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          failed=0
          for name in SSH_HOST SSH_USER DEPLOY_PATH SSH_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret ${name} 未配置或为空"
              failed=1
            fi
          done
          echo "SSH_HOST=[${SSH_HOST}]"
          echo "SSH_USER=[${SSH_USER}]"
          echo "SSH_PORT=[${SSH_PORT:-22}]"
          echo "DEPLOY_PATH=[${DEPLOY_PATH}]"
          printf '%s\n' "${SSH_KNOWN_HOSTS}" | grep -c . | xargs -I{} echo "SSH_KNOWN_HOSTS 非空行数: {}"
          exit ${failed}

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust server host key
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
        run: |
          PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # 去掉 Windows 换行符，避免 known_hosts 解析失败
          printf '%s\n' "${SSH_KNOWN_HOSTS}" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # Secret 里缺少某类主机密钥（比如只复制了一部分行）时，用 ssh-keyscan 补全
          ssh-keyscan -p "${PORT}" "${SSH_HOST}" 2>/dev/null | grep -v '^#' >> ~/.ssh/known_hosts || true
          sort -u -o ~/.ssh/known_hosts ~/.ssh/known_hosts

          echo "known_hosts 中的主机密钥指纹："
          ssh-keygen -lf ~/.ssh/known_hosts || true

          if ! ssh-keygen -F "${SSH_HOST}" -f ~/.ssh/known_hosts >/dev/null 2>&1; then
            echo "::error::无法获取 ${SSH_HOST} 的主机密钥，请检查 SSH_HOST、SSH_PORT、SSH_KNOWN_HOSTS"
            exit 1
          fi

          if [ -n "${SSH_HOST_FINGERPRINT}" ]; then
            if ! ssh-keygen -lf ~/.ssh/known_hosts | grep -qF "${SSH_HOST_FINGERPRINT}"; then
              echo "::error::主机密钥指纹与 SSH_HOST_FINGERPRINT 不匹配"
              exit 1
            fi
            echo "主机密钥指纹校验通过（${SSH_HOST_FINGERPRINT}）"
          else
            echo "提示：可配置 SSH_HOST_FINGERPRINT 做主机密钥指纹固定校验"
          fi
          echo "known_hosts 就绪"

      - name: Test SSH connection
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          PORT="${SSH_PORT:-22}"
          echo "尝试连接 ${SSH_USER}@${SSH_HOST}:${PORT}"
          set +e
          output=$(ssh -v -p "${PORT}" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            "${SSH_USER}@${SSH_HOST}" \
            "echo CONNECTED; whoami; ls -ld '${DEPLOY_PATH}'" 2>&1)
          code=$?
          echo "${output}" | tail -n 60
          exit ${code}

      - name: Sync dist to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          PORT="${SSH_PORT:-22}"
          TARGET="${DEPLOY_PATH%/}/"
          rsync -az --delete --chmod=D755,F644 \
            -e "ssh -p ${PORT} -o BatchMode=yes -o ConnectTimeout=20" \
            ./dist/ "${SSH_USER}@${SSH_HOST}:${TARGET}"

      - name: Verify site is reachable
        run: |
          curl -sSfL -o /dev/null --max-time 20 -w 'HTTP %{http_code}\n' https://blog.shiwu.dev/ || true
