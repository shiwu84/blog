<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="部署两次失败的关键日志示意">
  <rect width="1200" height="560" rx="18" fill="#161719"/>
  <rect x="1" y="1" width="1198" height="558" rx="18" fill="none" stroke="#2b2e33"/>
  <circle cx="34" cy="34" r="7" fill="#3a3d42"/>
  <circle cx="58" cy="34" r="7" fill="#3a3d42"/>
  <circle cx="82" cy="34" r="7" fill="#3a3d42"/>
  <text x="600" y="41" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="18" fill="#8b8d93">GitHub Actions · Deploy blog</text>
  <line x1="24" y1="62" x2="1176" y2="62" stroke="#2b2e33"/>

  <g font-family="ui-monospace, Consolas, monospace">
    <text x="46" y="112" font-size="21" fill="#9aa0a8">$ <tspan fill="#e4e5e8">Setup SSH agent</tspan></text>
    <circle cx="66" cy="152" r="9" fill="#9e3b32"/>
    <path d="M62 148 l8 8 M70 148 l-8 8" stroke="#f4f5f7" stroke-width="2.2" stroke-linecap="round"/>
    <text x="88" y="159" font-size="21" fill="#e0918b">Error: Input required and not supplied: ssh-private-key</text>

    <line x1="46" y1="196" x2="1154" y2="196" stroke="#24262a"/>

    <text x="46" y="244" font-size="21" fill="#9aa0a8">$ <tspan fill="#e4e5e8">Test SSH connection</tspan></text>
    <circle cx="66" cy="284" r="9" fill="#9e3b32"/>
    <path d="M62 280 l8 8 M70 280 l-8 8" stroke="#f4f5f7" stroke-width="2.2" stroke-linecap="round"/>
    <text x="88" y="291" font-size="21" fill="#e0918b">No ED25519 host key is known for 203.0.113.10 and you have</text>
    <text x="88" y="321" font-size="21" fill="#e0918b">requested strict checking.</text>
    <text x="88" y="371" font-size="21" fill="#e4e5e8">Host key verification failed.</text>
    <text x="46" y="431" font-size="21" fill="#8b8d93">##[error]Process completed with exit code 255.</text>
  </g>

  <line x1="24" y1="474" x2="1176" y2="474" stroke="#2b2e33"/>
  <text x="46" y="512" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="17" fill="#74777d">两次失败：第一次是 Secret 没配完，第二次是 known_hosts 里的主机密钥不完整</text>
</svg>
