<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="2026 年 10 月 17 日下午的部署流程">
  <rect width="1200" height="360" rx="18" fill="#1b1c1f"/>
  <rect x="1" y="1" width="1198" height="358" rx="18" fill="none" stroke="#2b2e33"/>
  <text x="48" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700" fill="#ececee">2026-10-17 · 一个下午的流程</text>
  <text x="48" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="17" fill="#94969c">从清理 Docker 服务到博客上线</text>

  <line x1="80" y1="205" x2="1120" y2="205" stroke="#3a3e45" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif" text-anchor="middle">
    <!-- 1 -->
    <circle cx="130" cy="205" r="13" fill="#1b1c1f" stroke="#7d838c" stroke-width="3"/>
    <text x="130" y="258" font-size="18" fill="#c4c5c9">清理 memos</text>
    <text x="130" y="284" font-size="18" fill="#c4c5c9">和 vaultwarden</text>
    <!-- 2 -->
    <circle cx="318" cy="205" r="13" fill="#1b1c1f" stroke="#7d838c" stroke-width="3"/>
    <text x="318" y="148" font-size="18" fill="#c4c5c9">选定</text>
    <text x="318" y="174" font-size="18" fill="#c4c5c9">LogFlow Theme</text>
    <!-- 3 -->
    <circle cx="506" cy="205" r="13" fill="#1b1c1f" stroke="#7d838c" stroke-width="3"/>
    <text x="506" y="258" font-size="18" fill="#c4c5c9">Cloudflare</text>
    <text x="506" y="284" font-size="18" fill="#c4c5c9">+ Caddy</text>
    <!-- 4 -->
    <circle cx="694" cy="205" r="13" fill="#b5534a"/>
    <text x="694" y="148" font-size="18" fill="#d98d86">第 1 次失败</text>
    <text x="694" y="174" font-size="18" fill="#d98d86">Secret 没配完</text>
    <!-- 5 -->
    <circle cx="882" cy="205" r="13" fill="#b5534a"/>
    <text x="882" y="258" font-size="18" fill="#d98d86">第 2 次失败</text>
    <text x="882" y="284" font-size="18" fill="#d98d86">known_hosts</text>
    <!-- 6 -->
    <circle cx="1070" cy="205" r="13" fill="#4e8a7b"/>
    <text x="1070" y="148" font-size="18" fill="#86b8a9" font-weight="700">部署成功</text>
  </g>
</svg>
