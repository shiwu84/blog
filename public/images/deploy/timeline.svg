<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="2026 年 10 月 17 日下午的部署流程">
  <rect width="1200" height="360" rx="18" fill="#f5f6f7"/>
  <rect x="1" y="1" width="1198" height="358" rx="18" fill="none" stroke="#e1e3e6"/>
  <text x="48" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700" fill="#17181a">2026-10-17 · 一个下午的流程</text>
  <text x="48" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="17" fill="#74777d">从清理 Docker 服务到博客上线</text>

  <line x1="80" y1="205" x2="1120" y2="205" stroke="#c9ccd1" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif" text-anchor="middle">
    <!-- 1 -->
    <circle cx="130" cy="205" r="13" fill="#ffffff" stroke="#6e7781" stroke-width="3"/>
    <text x="130" y="258" font-size="18" fill="#3f4348">清理 memos</text>
    <text x="130" y="284" font-size="18" fill="#3f4348">和 vaultwarden</text>
    <!-- 2 -->
    <circle cx="318" cy="205" r="13" fill="#ffffff" stroke="#6e7781" stroke-width="3"/>
    <text x="318" y="148" font-size="18" fill="#3f4348">选定</text>
    <text x="318" y="174" font-size="18" fill="#3f4348">LogFlow Theme</text>
    <!-- 3 -->
    <circle cx="506" cy="205" r="13" fill="#ffffff" stroke="#6e7781" stroke-width="3"/>
    <text x="506" y="258" font-size="18" fill="#3f4348">Cloudflare</text>
    <text x="506" y="284" font-size="18" fill="#3f4348">+ Caddy</text>
    <!-- 4 -->
    <circle cx="694" cy="205" r="13" fill="#9e3b32"/>
    <text x="694" y="148" font-size="18" fill="#9e3b32">第 1 次失败</text>
    <text x="694" y="174" font-size="18" fill="#9e3b32">Secret 没配完</text>
    <!-- 5 -->
    <circle cx="882" cy="205" r="13" fill="#9e3b32"/>
    <text x="882" y="258" font-size="18" fill="#9e3b32">第 2 次失败</text>
    <text x="882" y="284" font-size="18" fill="#9e3b32">known_hosts</text>
    <!-- 6 -->
    <circle cx="1070" cy="205" r="13" fill="#2f6b5f"/>
    <text x="1070" y="148" font-size="18" fill="#2f6b5f" font-weight="700">部署成功</text>
  </g>
</svg>
